name: test-mapping-spec.yml
on:
  pull_request:
    paths:
      - MIDI/Mappings.json
      - MIDI/Mappings-spec.json
  workflow_dispatch:
  push:
    paths:
      - MIDI/Mappings.json
      - MIDI/Mappings-spec.json

jobs:
  verify-mapping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Install ajv command
        run: npm install -g ajv-cli
      - name: Test Specification
        run: ajv test -s MIDI/Mappings-spec.json -d MIDI/Mappings.json --valid --data --all-errors --verbose --strict=true --strict-schema=true --strict-tuples=false --strict-types=true --strict-required=true